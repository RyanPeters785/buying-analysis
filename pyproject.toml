[project]
name = "buying-analysis"
version = "0.1.0"
description = "Honest backtest comparison of simple long-only strategies for a Roth IRA"
requires-python = ">=3.11,<3.12"
dependencies = [
    "pandas>=2.2,<2.3",
    "numpy>=1.26,<2.3",
    "pyarrow>=15",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyyaml>=6",
    "yfinance>=0.2.40",
    "pandas-market-calendars>=4.4",
    "tabulate>=0.10.0",
]

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.5"]
wrds = ["wrds>=3.2"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/buying_analysis"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
